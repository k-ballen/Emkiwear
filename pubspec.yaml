name: mi_primer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Pin exacto: 5.4.2 está publicado con código Pigeon v9 (nombres de canal sin
  # prefijo) incompatible con el nativo (Pigeon v25). 5.4.1 regeneró el Dart con
  # v25 y alinea los canales (dev.flutter.pigeon.firebase_core_platform_interface.*).
  firebase_core_platform_interface: 5.4.1
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  firebase_storage: ^12.1.2
  speech_to_text: ^7.2.0
  flutter_tts: ^4.2.1
  firebase_vertexai: ^0.2.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_logo.webp
